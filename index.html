<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday 🎉</title>

<style>
/* 🌙 Page base */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1a0033, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* ▶ Start button */
#start {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff0080, #ff8c00);
  color: white;
  cursor: pointer;
  z-index: 10;
  box-shadow: 0 0 15px rgba(255, 0, 128, 0.6);
}

/* 🔢 Countdown */
#countdown {
  font-size: 100px;
  font-weight: bold;
  display: none;
  animation: pop 1s infinite;
  z-index: 10;
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* 🎂 Birthday message */
#msg {
  font-size: 50px;
  text-align: center;
  display: none;
  animation: glow 1.5s infinite alternate;
  z-index: 10;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #ff00ff; }
  to { text-shadow: 0 0 30px #ffff00; }
}

/* 🎆 Fireworks */
.firework {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: explode 1.2s ease-out forwards;
  z-index: 1;
}

@keyframes explode {
  0% {
    transform: scale(0.3);
    opacity: 1;
  }
  100% {
    transform: scale(4);
    opacity: 0;
  }
}

/* 🎈 Balloons */
.balloon {
  position: absolute;
  bottom: -70px;
  width: 40px;
  height: 55px;
  border-radius: 50%;
  animation: floatUp 6s linear forwards;
  z-index: 1;
}

.balloon::after {
  content: "";
  position: absolute;
  bottom: -22px;
  left: 50%;
  width: 2px;
  height: 22px;
  background: white;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-120vh);
    opacity: 0;
  }
}
</style>


</head>

<body>
<div class="ribbon" style="left:10%"></div>
<div class="ribbon" style="left:30%"></div>
<div class="ribbon" style="left:50%"></div>
<div class="ribbon" style="left:70%"></div>
<div class="ribbon" style="left:90%"></div>

<button id="start">▶ Start</button>
<div id="countdown">3</div>
<h1 id="msg">🎉 Happy Birthday Baby,
    I love you so much! 🎂</h1>

<audio id="music">
  <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const startBtn = document.getElementById("start");
  const countdown = document.getElementById("countdown");
  const msg = document.getElementById("msg");
  const music = document.getElementById("music");

  if (!startBtn) {
    console.error("Start button not found");
    return;
  }

  // 🎆 NEW YEAR FIREWORKS
  function launchFirework() {
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight * 0.5;
    const colors = ["#ff004c", "#00eaff", "#ffee00", "#ff8cff", "#00ff6a"];

    for (let i = 0; i < 30; i++) {
      const p = document.createElement("div");
      p.className = "firework-particle";

      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 200 + 50;

      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.backgroundColor =
        colors[Math.floor(Math.random() * colors.length)];

      p.style.setProperty("--dx", Math.cos(angle) * distance + "px");
      p.style.setProperty("--dy", Math.sin(angle) * distance + "px");

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1500);
    }
  }

  function startFireworks() {
    setInterval(launchFirework, 700);
  }

  // 🎈 BALLOONS
  function releaseBalloon() {
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.left = Math.random() * 90 + "vw";
    b.style.backgroundColor =
      `hsl(${Math.random() * 360},80%,60%)`;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }

  function startBalloons() {
    setInterval(releaseBalloon, 900);
  }

  // ▶️ START BUTTON CLICK
  startBtn.addEventListener("click", () => {
    startBtn.style.display = "none";

    startFireworks();
    startBalloons();

    let c = 3;
    countdown.style.display = "block";
    countdown.textContent = c;

    const timer = setInterval(() => {
      c--;
      countdown.textContent = c;

      if (c <= 0) {
        clearInterval(timer);
        countdown.style.display = "none";
        msg.style.display = "block";
        if (music) music.play();
      }
    }, 1000);
  });

});
</script>







</body>
</html>
